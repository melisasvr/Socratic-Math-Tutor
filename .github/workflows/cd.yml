name: CD

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: write

jobs:
  package:
    name: Package Build
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.meta.outputs.archive_name }}
      archive_path: ${{ steps.meta.outputs.archive_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests before release
        run: |
          pytest -q

      - name: Set artifact metadata
        id: meta
        run: |
          ARCHIVE_NAME=socratic-math-tutor-${GITHUB_REF_NAME:-manual}.zip
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_path=dist/${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="${{ steps.meta.outputs.archive_path }}" HEAD

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: ${{ steps.meta.outputs.archive_path }}

  deploy-development:
    name: Deploy Development Artifact
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'development')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.archive_name }}
          path: dist

      - name: Publish development artifact summary
        run: |
          echo "Development package ready: dist/${{ needs.package.outputs.archive_name }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Publish Production Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.archive_name }}
          path: dist

      - name: Publish production artifact summary
        run: |
          echo "Production package ready: dist/${{ needs.package.outputs.archive_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
